# Ory Kratos v26.2.0 config for the local auth stack (start-auth-stack!).
#
# Kept in step with the consuming host's production Kratos config wherever it
# changes what a user sees or what a whoami caller gets back: the registration
# style, the second-factor methods, the session lifespan and whoami's
# required_aal. Hostnames, ports and cookies stay local. Recovery,
# verification and the courier stay off because nothing local sends mail.
#
# The cookie and cipher secrets are deliberately NOT in this file. Kratos
# does not perform $VAR-style environment substitution in YAML config
# values: a literal `$KRATOS_CIPHER_SECRET` placeholder is parsed as a
# 21-character secret, fails the >= 32 character schema check, and crashes
# the container on boot (see docs/tasks/kratos-cipher-secret-config.md).
# The secrets are supplied through Kratos's native env-var config mapping
# instead: SECRETS_COOKIE and SECRETS_CIPHER, set by
# server.docker-env/start-auth-stack!.

# TEMPLATE: `server.docker-env/render-kratos-config!` fills the {{...}}
# placeholders with the configured hostnames and writes docker/generated/
# kratos.yml, which is what the containers mount -- Kratos does no
# substitution of its own. TLS is served natively from the mkcert pair
# `start-auth-stack!` mounts at /etc/ory/tls; there is no plain-HTTP listener.
serve:
  public:
    base_url: {{KRATOS_PUBLIC_URL}}/
    tls:
      cert:
        path: /etc/ory/tls/ory.pem
      key:
        path: /etc/ory/tls/ory-key.pem
    cors:
      enabled: true
      allowed_origins:
        - {{LOGIN_APP_BASE_URL}}
      allowed_methods:
        - POST
        - GET
        - PUT
        - PATCH
        - DELETE
      allowed_headers:
        - Authorization
        - Cookie
        - Content-Type
      exposed_headers:
        - Content-Type
        - Set-Cookie
  admin:
    base_url: {{KRATOS_ADMIN_URL}}/
    tls:
      cert:
        path: /etc/ory/tls/ory.pem
      key:
        path: /etc/ory/tls/ory-key.pem

selfservice:
  # The login-consent app (Hydra login/consent challenge UI) serves the
  # credential screens; 3001 avoids the FHIR test-server on 3000.
  default_browser_return_url: {{LOGIN_APP_BASE_URL}}/
  allowed_return_urls:
    - {{LOGIN_APP_BASE_URL}}
  methods:
    password:
      enabled: true
    profile:
      enabled: false
    # The second factors production enables. Enabling them enforces nothing:
    # Kratos asks for a second factor only from an identity that has enrolled
    # one. Once an identity has, a password-only login answers 422
    # browser_location_change_required (redirect to ?aal=aal2, return_to
    # kept), and whoami answers its aal1 sessions with 403
    # session_aal2_required (see session.whoami below).
    totp:
      enabled: true
      config:
        # A label of its own keeps a local enrolment from sitting next to a
        # production one in an authenticator app under the same name.
        issuer: dromon (local)
    lookup_secret:
      enabled: true
  flows:
    # Where the second factors above are enrolled.
    settings:
      ui_url: {{LOGIN_APP_BASE_URL}}/kratos/settings
    login:
      ui_url: {{LOGIN_APP_BASE_URL}}/kratos/login
    registration:
      # Production pins one-step registration. Without it Kratos v1.2+
      # defaults to profile_first, a two-screen sign-up production does not
      # show.
      style: unified
      ui_url: {{LOGIN_APP_BASE_URL}}/kratos/register
    recovery:
      enabled: false
    verification:
      enabled: false

log:
  level: info
  format: text
  leak_sensitive_values: false

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

session:
  # Production's values. required_aal is the Kratos default, written down
  # because whoami's 403 for an enrolled identity's aal1 session depends on it.
  lifespan: 24h
  whoami:
    required_aal: highest_available
