# TLS terminator in front of Keto for the auth stack (server.docker-env
# start-auth-stack!). Keto's config schema documents serve.read.tls and
# serve.write.tls, but neither v0.12 nor v26.2 applies them to the REST
# listeners, so TLS is terminated here: Keto's own ports are not published on
# the host and this container presents them as
# https://localketo.breezeehr.com:4466 (read) and :4467 (write), from the
# same mkcert pair Hydra and Kratos serve natively.
#
# nginx resolves the `keto` name once at startup, so this container is
# recreated after Keto is.
events {}
http {
  server {
    listen 4466 ssl;
    server_name localketo.breezeehr.com;
    ssl_certificate     /etc/nginx/certs/ory.pem;
    ssl_certificate_key /etc/nginx/certs/ory-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
      proxy_pass http://keto:4466;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
  server {
    listen 4467 ssl;
    server_name localketo.breezeehr.com;
    ssl_certificate     /etc/nginx/certs/ory.pem;
    ssl_certificate_key /etc/nginx/certs/ory-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
      proxy_pass http://keto:4467;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
