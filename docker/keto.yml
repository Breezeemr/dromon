version: v0.11.0-alpha.0

dsn: memory

serve:
  read:
    host: 0.0.0.0
    port: 4466
  write:
    host: 0.0.0.0
    port: 4467

# Static list rather than the OPL file: the production first-party
# namespaces carry hyphens, which are not valid OPL class names. Plain
# tuple reads/writes/checks (all this stack uses) need only the names.
namespaces:
  - id: 0
    name: User
  - id: 1
    name: Group
  - id: 2
    name: fhir
  - id: 3
    name: breezeehr-role
  - id: 4
    name: practitioner-id

log:
  level: info
  format: text
