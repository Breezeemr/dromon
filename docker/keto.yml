version: v0.11.0-alpha.0

dsn: memory

serve:
  read:
    host: 0.0.0.0
    port: 4466
  write:
    host: 0.0.0.0
    port: 4467

# Static list rather than the OPL file: plain tuple reads/writes/checks (all
# this stack uses) need only the names, and a host that adds namespaces of its
# own may use names (with hyphens, say) that are not valid OPL class names.
namespaces:
  - id: 0
    name: User
  - id: 1
    name: Group
  - id: 2
    name: fhir

log:
  level: info
  format: text
